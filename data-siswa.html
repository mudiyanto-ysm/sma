<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data Siswa - Sistem Manajemen Dokumen Sekolah</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans text-gray-800">

    <div class="flex h-screen">
        <div class="w-64 bg-slate-800 text-white flex flex-col p-4 space-y-6">
            <div class="text-xl font-bold tracking-wider border-b border-slate-700 pb-4">
                🏫 SIAKAD SMA
            </div>
            <nav class="flex-1 space-y-2">
                <a href="dashboard.html" class="block px-4 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700 hover:text-white transition">📁 Dashboard</a>
                <a href="index.html" class="block px-4 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700 hover:text-white transition">📑 Generator Surat</a>
                <a href="data-siswa.html" class="block px-4 py-2.5 rounded-lg bg-blue-600 text-white font-medium shadow-md">👥 Data Siswa</a>
                <span class="flex items-center justify-between px-4 py-2.5 rounded-lg text-slate-600 cursor-not-allowed select-none" title="Segera hadir">📝 Data Guru <span class="text-[10px] bg-slate-700 text-slate-400 px-1.5 py-0.5 rounded">segera</span></span>
                <a href="pengaturan.html" class="block px-4 py-2.5 rounded-lg text-slate-400 hover:bg-slate-700 hover:text-white transition">⚙️ Pengaturan</a>
            </nav>
            <div class="text-xs text-slate-500 border-t border-slate-700 pt-4">
                Hak Akses: <span class="text-slate-300 font-medium">Staf Tata Usaha</span>
            </div>
        </div>

        <div class="flex-1 flex flex-col overflow-y-auto">
            <header class="bg-white border-b border-gray-200 px-8 py-4 flex justify-between items-center">
                <h1 class="text-2xl font-bold text-gray-800">Data Siswa</h1>
                <button onclick="bukaModal()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-medium px-4 py-2 rounded-lg shadow">+ Tambah Siswa</button>
            </header>

            <main class="p-8 max-w-4xl w-full mx-auto space-y-4">
                <input type="text" id="cariTabel" placeholder="Cari nama atau NISN..." class="w-full border border-gray-300 rounded-lg p-2.5 bg-white focus:ring-2 focus:ring-blue-500 focus:outline-none">

                <div class="bg-white rounded-xl shadow-sm border border-gray-200 overflow-hidden">
                    <table class="w-full text-sm">
                        <thead class="bg-gray-50 text-gray-500 uppercase text-xs">
                            <tr>
                                <th class="text-left px-6 py-3">NISN</th>
                                <th class="text-left px-6 py-3">Nama Siswa</th>
                                <th class="text-left px-6 py-3">Kelas</th>
                                <th class="text-right px-6 py-3">Aksi</th>
                            </tr>
                        </thead>
                        <tbody id="tabelSiswa" class="divide-y divide-gray-100">
                            <tr><td colspan="4" class="px-6 py-6 text-center text-gray-400">Memuat data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal Tambah/Edit Siswa -->
    <div id="modalSiswa" class="hidden fixed inset-0 bg-black/40 flex items-center justify-center z-50 p-4">
        <div class="bg-white rounded-xl shadow-lg w-full max-w-md p-6 space-y-4">
            <h2 id="judulModal" class="text-lg font-bold text-gray-800">Tambah Siswa</h2>
            <input type="hidden" id="idSiswaEdit">
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">NISN</label>
                <input type="text" id="formNisn" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Nama Siswa</label>
                <input type="text" id="formNama" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <div>
                <label class="block text-sm font-semibold text-gray-700 mb-1">Kelas</label>
                <input type="text" id="formKelas" placeholder="Contoh: XI-A" class="w-full border border-gray-300 rounded-lg p-2.5 focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>
            <p id="pesanError" class="text-sm text-red-600 hidden"></p>
            <div class="flex justify-end gap-2 pt-2">
                <button onclick="tutupModal()" class="px-4 py-2 text-sm rounded-lg border border-gray-300 hover:bg-gray-50">Batal</button>
                <button onclick="simpanSiswa()" class="px-4 py-2 text-sm rounded-lg bg-blue-600 text-white hover:bg-blue-700">Simpan</button>
            </div>
        </div>
    </div>

    <script>
        let semuaSiswa = [];

        function muatData() {
            fetch('/api/siswa/list')
                .then(r => r.json())
                .then(data => {
                    semuaSiswa = data;
                    tampilkanTabel(data);
                })
                .catch(() => {
                    document.getElementById('tabelSiswa').innerHTML = '<tr><td colspan="4" class="px-6 py-6 text-center text-red-500">Gagal memuat data.</td></tr>';
                });
        }

        function tampilkanTabel(data) {
            const tbody = document.getElementById('tabelSiswa');
            if (data.length === 0) {
                tbody.innerHTML = '<tr><td colspan="4" class="px-6 py-6 text-center text-gray-400">Belum ada data siswa.</td></tr>';
                return;
            }
            tbody.innerHTML = data.map(s => `
                <tr class="hover:bg-gray-50">
                    <td class="px-6 py-3">${s.nisn}</td>
                    <td class="px-6 py-3 font-medium">${s.nama_siswa}</td>
                    <td class="px-6 py-3">${s.kelas}</td>
                    <td class="px-6 py-3 text-right space-x-2">
                        <button onclick='bukaModal(${JSON.stringify(s).replace(/'/g, "&#39;")})' class="text-blue-600 hover:underline text-xs font-medium">Edit</button>
                        <button onclick="hapusSiswa(${s.id_siswa}, '${s.nama_siswa.replace(/'/g, "\\'")}')" class="text-red-600 hover:underline text-xs font-medium">Hapus</button>
                    </td>
                </tr>`).join('');
        }

        document.getElementById('cariTabel').addEventListener('input', function() {
            const kw = this.value.toLowerCase();
            tampilkanTabel(semuaSiswa.filter(s => s.nama_siswa.toLowerCase().includes(kw) || s.nisn.includes(kw)));
        });

        function bukaModal(siswa) {
            document.getElementById('pesanError').classList.add('hidden');
            if (siswa) {
                document.getElementById('judulModal').textContent = 'Edit Siswa';
                document.getElementById('idSiswaEdit').value = siswa.id_siswa;
                document.getElementById('formNisn').value = siswa.nisn;
                document.getElementById('formNama').value = siswa.nama_siswa;
                document.getElementById('formKelas').value = siswa.kelas;
            } else {
                document.getElementById('judulModal').textContent = 'Tambah Siswa';
                document.getElementById('idSiswaEdit').value = '';
                document.getElementById('formNisn').value = '';
                document.getElementById('formNama').value = '';
                document.getElementById('formKelas').value = '';
            }
            document.getElementById('modalSiswa').classList.remove('hidden');
        }

        function tutupModal() {
            document.getElementById('modalSiswa').classList.add('hidden');
        }

        function simpanSiswa() {
            const id = document.getElementById('idSiswaEdit').value;
            const payload = {
                nisn: document.getElementById('formNisn').value.trim(),
                nama_siswa: document.getElementById('formNama').value.trim(),
                kelas: document.getElementById('formKelas').value.trim()
            };
            if (!payload.nisn || !payload.nama_siswa || !payload.kelas) {
                const el = document.getElementById('pesanError');
                el.textContent = 'NISN, Nama, dan Kelas wajib diisi.';
                el.classList.remove('hidden');
                return;
            }

            const url = id ? `/api/siswa/${id}` : '/api/siswa';
            const method = id ? 'PUT' : 'POST';

            fetch(url, { method, headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) })
                .then(async r => {
                    if (!r.ok) { const e = await r.json(); throw new Error(e.error || 'Gagal menyimpan'); }
                    return r.json();
                })
                .then(() => { tutupModal(); muatData(); })
                .catch(err => {
                    const el = document.getElementById('pesanError');
                    el.textContent = err.message;
                    el.classList.remove('hidden');
                });
        }

        function hapusSiswa(id, nama) {
            if (!confirm(`Yakin ingin menghapus data siswa "${nama}"?`)) return;
            fetch(`/api/siswa/${id}`, { method: 'DELETE' })
                .then(async r => {
                    if (!r.ok) { const e = await r.json(); throw new Error(e.error || 'Gagal menghapus'); }
                    return r.json();
                })
                .then(() => muatData())
                .catch(err => alert(err.message));
        }

        muatData();
    </script>
</body>
</html>
